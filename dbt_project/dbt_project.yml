name: fitcore_mrr
version: "1.0.0"
config-version: 2
profile: fitcore_mrr

require-dbt-version: [">=1.10.0", "<2.0.0"]

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

flags:
  require_generic_test_arguments_property: true

vars:
  # Primeiro mês da série de MRR (o último é derivado dos dados)
  mrr_start_month: "2023-01-01"
  # Exigido pelo dbt_date (dependência do dbt-expectations)
  "dbt_date:time_zone": "America/Sao_Paulo"

models:
  fitcore_mrr:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  fitcore_mrr:
    +schema: raw
    plans:
      +column_types:
        plan_id: varchar
        plan_name: varchar
        tier: varchar
        billing_period: varchar
        list_price: decimal(14,2)

data_tests:
  fitcore_mrr:
    # Toda linha que viola um teste fica gravada no schema "audit" para investigação
    +store_failures: true
    +schema: audit
